<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - طلابي نظام إدارة الطلاب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-page-container">
        <!-- الشريط العلوي -->
        <header class="top-utility-bar">
            <button type="button" id="themeToggleBtn" class="utility-btn">
                <i class="bi bi-sun-fill text-warning" id="themeIcon"></i>
                <span id="themeText" data-i18n="theme_light">الوضع النهاري</span>
            </button>
            <button type="button" id="langToggleBtn" class="utility-btn">
                <img src="https://flagcdn.com/w40/us.png" alt="Flag" class="flag-img" id="langFlag">
                <span id="langText">English</span>
            </button>
        </header>

        <div class="auth-split-wrapper">
            <div class="card-custom" style="max-width: 520px; width: 100%;">
                <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
                    <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
                    <div class="brand-text text-start">
                        <h4 data-i18n="app_name">طلابي</h4>
                        <span data-i18n="app_subtitle">نظام إدارة الطلاب</span>
                    </div>
                </div>

                <h5 class="text-center fw-bold mb-1" data-i18n="reg_title">إنشاء حساب مدير جديد</h5>
                <p class="text-center text-secondary small mb-4" data-i18n="reg_sub">سجّل حسابك للتمكن من إدارة بيانات الطلاب</p>

                <div id="registerAlert" class="alert d-none py-2 small" role="alert"></div>

                <form id="registerForm" action="register.php" method="POST" novalidate>
                    <div class="mb-3">
                        <label for="reg_username" class="form-label small" data-i18n="lbl_username">اسم المستخدم (Username)</label>
                        <input type="text" class="form-control" id="reg_username" name="username" required placeholder="مثال: ahmad_admin">
                    </div>

                    <div class="mb-3">
                        <label for="reg_email" class="form-label small" data-i18n="lbl_email">البريد الإلكتروني (Email)</label>
                        <input type="email" class="form-control" id="reg_email" name="email" required placeholder="admin@svuonline.org">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="reg_password" class="form-label small" data-i18n="lbl_password">كلمة المرور</label>
                            <input type="password" class="form-control" id="reg_password" name="password" required placeholder="6 محارف على الأقل">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label for="reg_confirm_password" class="form-label small" data-i18n="lbl_confirm_pass">تأكيد كلمة المرور</label>
                            <input type="password" class="form-control" id="reg_confirm_password" name="confirm_password" required placeholder="أعد كتابة كلمة المرور">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gold w-100 py-2" data-i18n="btn_register">إنشاء الحساب</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary">
                    <small class="text-secondary">
                        <span data-i18n="have_account">لديك حساب بالفعل؟</span>
                        <a href="login.html" style="color: var(--gold-primary);" class="text-decoration-none fw-bold ms-1" data-i18n="login_now">تسجيل الدخول</a>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
